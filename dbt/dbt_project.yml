name: erp_data_platform
version: "0.1.0"
config-version: 2
profile: erp_data_platform
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
vars:
  # Receivables are aged as of this date. The simulation ends here, so the
  # numbers stay the same whenever the project is rebuilt.
  as_of: "2026-10-27"
  company_currency: "USD"
models:
  erp_data_platform:
    staging: {+materialized: view, +schema: staging}
    intermediate: {+materialized: view, +schema: intermediate}
    marts: {+materialized: table, +schema: marts}
