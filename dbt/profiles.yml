deal_to_cash:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('EDP_PGHOST', '/tmp') }}"
      port: 5432
      user: "{{ env_var('EDP_PGUSER', 'odoo') }}"
      password: "{{ env_var('EDP_PGPASSWORD', '') }}"
      dbname: "{{ env_var('EDP_PGDATABASE', 'warehouse') }}"
      schema: dbt
      threads: 4
